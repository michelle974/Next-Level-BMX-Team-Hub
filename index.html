<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TEAM HUB">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Next Level BMX — Team Hub</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/appicon.png">
<link rel="icon" href="/appicon.png">
<style>
  :root {
    --green: #38f100;
    --orange: #ff5500;
    --black: #000000;
    --white: #ffffff;
    --tile: #f4f4f4;
    --line: #dcdcdc;
    --text: #111111;
    --muted: #666666;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--black); overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text); font-size: 17px;
  }
  #app {
    max-width: 560px; margin: 0 auto; height: 100%;
    display: flex; flex-direction: column; background: var(--black);
  }

  /* ---------- fixed header ---------- */
  header { background: var(--black); flex-shrink: 0; padding-top: env(safe-area-inset-top); }
  .head-top {
    display: grid; grid-template-columns: 74px 1fr 74px;
    align-items: center; padding: 2px 12px 0;
  }
  .head-btn {
    background: none; border: none; color: var(--green);
    font-size: 17px; font-weight: 700; padding: 12px 2px;
    cursor: pointer; font-family: inherit;
  }
  .head-btn.right { text-align: right; }
  .head-btn:disabled { opacity: 0; pointer-events: none; }
  .head-logo { display: flex; justify-content: center; padding: 2px 0 14px; }
  .head-logo img { width: 100%; max-width: 330px; height: auto; display: block; }
  .accent { height: 5px; background: var(--green); flex-shrink: 0; }

  /* ---------- scrolling body ---------- */
  main {
    background: var(--white); flex: 1; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 22px 18px 40px;
  }
  .footer-band {
    background: var(--black); flex-shrink: 0;
    height: 30px; padding-bottom: env(safe-area-inset-bottom);
  }

  h2 { font-size: 27px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 16px; margin: 0 0 22px; line-height: 1.4; }

  .center-wrap {
    min-height: 100%; display: flex; flex-direction: column;
    justify-content: center; padding-bottom: 20px;
  }
  .center-wrap h2 { font-size: 31px; text-align: center; }
  .center-wrap .sub { text-align: center; font-size: 17px; }

  /* ---------- banner ---------- */
  .banner {
    display: flex; align-items: center; gap: 14px;
    border-radius: 16px; padding: 16px 18px; margin-bottom: 24px;
    cursor: pointer; border: none; width: 100%; text-align: left; font-family: inherit;
  }
  .banner.orange { background: var(--orange); }
  .banner.neutral { background: var(--tile); border: 2px solid var(--line); }
  .banner .bicon {
    width: 50px; height: 50px; background: #fff; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-size: 24px;
  }
  .banner .t1 { font-size: 18px; font-weight: 800; }
  .banner .t2 { font-size: 14px; margin-top: 2px; }
  .banner.orange .t1, .banner.orange .t2 { color: #fff; }
  .banner.orange .t2 { opacity: .95; }
  .banner.neutral .t1 { color: var(--text); }
  .banner.neutral .t2 { color: var(--muted); }

  /* ---------- tiles ---------- */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px 10px; }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    background: none; border: none; padding: 0; cursor: pointer; font-family: inherit;
  }
  .tile:active { transform: scale(.94); }
  .ticon {
    width: 80px; height: 80px; background: var(--tile); border-radius: 20px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .ticon img { width: 78%; height: 78%; object-fit: contain; }
  .tile span {
    font-size: 13px; font-weight: 700; text-align: center;
    color: var(--text); line-height: 1.25;
  }

  /* ---------- inputs ---------- */
  label { display: block; font-size: 15px; font-weight: 700; margin: 20px 0 7px; }
  input, select, textarea {
    width: 100%; padding: 15px; font-size: 17px; font-family: inherit;
    border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--green); }
  .btn {
    width: 100%; padding: 17px; margin-top: 26px; font-size: 18px; font-weight: 800;
    background: var(--black); color: var(--green); border: none; border-radius: 14px;
    cursor: pointer; font-family: inherit;
  }
  .btn:active { opacity: .85; }
  .btn.alt { background: var(--tile); color: var(--text); }
  .btn.orange { background: var(--orange); color: #fff; }
  .btn.slim { padding: 13px; font-size: 15px; margin-top: 14px; }
  .btn.tiny { width: auto; padding: 11px 17px; font-size: 15px; margin: 0; }
  .linkbtn {
    background: none; border: none; color: var(--muted); font-size: 16px;
    text-decoration: underline; cursor: pointer; margin-top: 20px;
    width: 100%; font-family: inherit; padding: 10px;
  }
  .radio-row { display: flex; gap: 9px; margin-top: 8px; }
  .radio-row button {
    flex: 1; padding: 14px 4px; font-size: 14.5px; font-weight: 700;
    border: 2px solid var(--line); border-radius: 12px; background: #fff;
    cursor: pointer; font-family: inherit; color: var(--text); line-height: 1.2;
  }
  .radio-row button.on { background: var(--black); color: var(--green); border-color: var(--black); }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; border-bottom: 1px solid var(--line); gap: 14px;
  }
  .toggle-row .tl { font-size: 16px; font-weight: 600; }
  .toggle-row .tn { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
  .switch {
    width: 54px; height: 32px; border-radius: 16px; background: #ccc;
    border: none; position: relative; cursor: pointer; flex-shrink: 0;
  }
  .switch.on { background: var(--green); }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px;
    border-radius: 50%; background: #fff; transition: transform .15s;
  }
  .switch.on::after { transform: translateX(22px); }

  /* ---------- cards ---------- */
  .card {
    border: 2px solid var(--line); border-radius: 14px; padding: 16px;
    margin-bottom: 12px; background: #fff; cursor: pointer;
  }
  .card.flat { cursor: default; }
  .card.done { border-color: var(--green); background: #f6fff2; }
  .card .cname { font-size: 17.5px; font-weight: 700; }
  .card .cmeta { font-size: 14.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .pill {
    display: inline-block; font-size: 11.5px; font-weight: 800; padding: 4px 10px;
    border-radius: 20px; margin-left: 8px; vertical-align: middle; white-space: nowrap;
  }
  .pill.ok { background: #e4ffd9; color: #2a7000; }
  .pill.wait { background: #fff0e0; color: #a34e00; }
  .pill.due { background: #ffe4e4; color: #a01414; }
  .countbig { font-size: 15px; font-weight: 800; color: var(--orange); white-space: nowrap; }
  .countbig.clear { color: #2a7000; }

  .kv {
    display: flex; justify-content: space-between; padding: 15px 0;
    border-bottom: 1px solid var(--line); font-size: 16.5px; gap: 14px;
  }
  .kv .k { color: var(--muted); flex-shrink: 0; }
  .kv .v { font-weight: 600; text-align: right; word-break: break-word; }
  .kv .v a { color: var(--text); text-decoration: none; border-bottom: 2px solid var(--green); }

  .sechead {
    font-size: 14px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); margin: 30px 0 12px;
  }
  .sechead.warn { color: var(--orange); }

  .agreement {
    max-height: 330px; overflow-y: auto; border: 2px solid var(--line);
    border-radius: 12px; padding: 17px; font-size: 15px; line-height: 1.6;
    background: #fafafa; margin-top: 10px;
  }
  .agreement h4 { margin: 18px 0 6px; font-size: 16px; }
  .agreement h4:first-child { margin-top: 0; }
  .agreement ul { margin: 6px 0; padding-left: 20px; }
  .agreement li { margin-bottom: 6px; }

  .msg { padding: 14px 16px; border-radius: 12px; font-size: 15.5px; margin-top: 18px; line-height: 1.45; }
  .msg.err { background: #ffe8e8; color: #a00; }
  .msg.ok { background: #e4ffd9; color: #2a7000; }
  .msg.info { background: var(--tile); color: var(--text); }
  .empty { text-align: center; color: var(--muted); font-size: 16.5px; padding: 50px 20px; line-height: 1.5; }
  .spinner {
    width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--green);
    border-radius: 50%; animation: spin .7s linear infinite; margin: 60px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .steps { font-size: 13.5px; color: var(--muted); font-weight: 800; letter-spacing: .05em; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="head-top">
      <button class="head-btn" id="backBtn" onclick="goBack()">‹ Back</button>
      <span></span>
      <button class="head-btn right" id="menuBtn" onclick="go('profile')">Me</button>
    </div>
    <div class="head-logo"><img src="/logo.png" alt="Next Level BMX"></div>
  </header>
  <div class="accent"></div>
  <main id="view"><div class="spinner"></div></main>
  <div class="footer-band"></div>
</div>

<script>
/* ============ state ============ */
const S = {
  user: null, session: null, fields: {},
  tiles: [], config: {}, agreement: '',
  riders: [], unlinked: [], riderIndex: [],
  events: null, myRiders: null, event: null,
  isAdmin: false, screen: 'loading', history: [],
  viewRider: null, editing: null, linking: null, payTarget: null,
};

const api = async (action, payload = {}) => {
  const res = await fetch('/api/asana', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, gid: S.user?.gid, session: S.session, ...payload }),
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || 'Something went wrong.');
  return json;
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const save = () => localStorage.setItem('nlbmx_hub',
  JSON.stringify({ gid: S.user?.gid, session: S.session }));
const clearSave = () => localStorage.removeItem('nlbmx_hub');

/* ---- formatting ---- */
function fmtDate(iso) {
  if (!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return iso;
  return `${m[2]}-${m[3]}-${m[1]}`;
}
function fmtRange(a, b) {
  if (!a) return '';
  if (!b || b === a) return fmtDate(a);
  const x = String(a).match(/^(\d{4})-(\d{2})-(\d{2})/);
  const y = String(b).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (x && y && x[1] === y[1] && x[2] === y[2]) return `${x[2]}-${x[3]}–${y[3]}-${x[1]}`;
  return `${fmtDate(a)} – ${fmtDate(b)}`;
}
function fmtPhone(p) {
  const d = String(p || '').replace(/\D/g, '');
  if (d.length === 10) return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
  if (d.length === 11 && d[0] === '1') return `${d.slice(1,4)}-${d.slice(4,7)}-${d.slice(7)}`;
  return p || '';
}
const telHref = p => 'tel:' + String(p || '').replace(/\D/g, '');

function age(dob) {
  if (!dob) return '';
  const b = new Date(dob); if (isNaN(b)) return '';
  const t = new Date();
  let a = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
  return a;
}
const isMinor = dob => { const a = age(dob); return a !== '' && a < 18; };

/* ---- icons ---- */
const ICON_FILE = {
  'Team Forms': 'team-forms', 'Schedule': 'schedule', 'Roster': 'roster',
  'Training App': 'training-app', 'Chat': 'chat', 'Sponsorship': 'sponsorship',
  'Training Payments': 'payments', 'Gear Ordering': 'gear-ordering',
  'Photo Sharing': 'photos', 'Sign-Ups': 'sign-ups', 'Race Stats': 'race-stats',
  'Files': 'files', 'Socials': 'socials',
};
const iconFor = (label, custom) =>
  custom ? esc(custom) : `/icons/${ICON_FILE[label] || 'files'}.png`;

/* ---- agreement rendering ---- */
function renderAgreement(raw) {
  if (!raw) return '<p>Agreement text has not been set yet.</p>';
  const out = [];
  let inList = false;
  for (const line of raw.split('\n')) {
    const t = line.trim();
    if (!t) continue;
    if (t.startsWith('##')) {
      if (inList) { out.push('</ul>'); inList = false; }
      out.push(`<h4>${esc(t.replace(/^#+\s*/, ''))}</h4>`);
    } else if (t.startsWith('-')) {
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push(`<li>${esc(t.replace(/^-\s*/, ''))}</li>`);
    } else {
      if (inList) { out.push('</ul>'); inList = false; }
      out.push(`<p>${esc(t)}</p>`);
    }
  }
  if (inList) out.push('</ul>');
  return out.join('');
}

/* ---- external links: leave standalone mode cleanly ---- */
function openExternal(url) {
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ============ nav ============ */
function go(screen, push = true) {
  if (push && S.screen !== screen) S.history.push(S.screen);
  S.screen = screen;
  render();
}
function goBack() { S.screen = S.history.pop() || 'home'; render(); }

/* ============ boot ============ */
async function boot() {
  try {
    const res = await fetch('/api/asana?action=bootstrap');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    S.tiles = data.tiles || [];
    S.config = data.config || {};
    S.agreement = data.agreement || '';
  } catch (e) {
    document.getElementById('view').innerHTML =
      `<div class="msg err">Couldn't reach the server.<br><small>${esc(e.message)}</small></div>`;
    return;
  }
  const saved = JSON.parse(localStorage.getItem('nlbmx_hub') || 'null');
  if (saved?.gid && saved?.session) {
    try {
      S.session = saved.session; S.user = { gid: saved.gid };
      const me = await api('me');
      S.user = me.user; S.fields = me.fields; S.isAdmin = me.user.isAdmin;
      S.screen = 'home';
    } catch {
      clearSave(); S.user = null; S.session = null; S.screen = 'auth';
    }
  } else S.screen = 'auth';
  render();
}

/* ============ render ============ */
function render() {
  const v = document.getElementById('view');
  document.getElementById('backBtn').disabled = ['auth','home','loading'].includes(S.screen);
  document.getElementById('menuBtn').disabled = ['auth','loading'].includes(S.screen);
  v.innerHTML = (SCREENS[S.screen] || SCREENS.home)();
  v.scrollTop = 0;
}

const SCREENS = {
  loading: () => '<div class="spinner"></div>',

  /* ---------- auth ---------- */
  auth: () => {
    const m = window.__authMode || 'login';
    if (m === 'login') return `
      <div class="center-wrap">
        <h2>Welcome back</h2>
        <p class="sub">Sign in with your email and PIN.</p>
        <label>Email</label>
        <input id="li_email" type="email" autocomplete="email" placeholder="you@email.com">
        <label>PIN</label>
        <input id="li_pin" type="password" inputmode="numeric" placeholder="••••">
        <button class="btn" onclick="doLogin()">Sign In</button>
        <button class="linkbtn" onclick="window.__authMode='signup';render()">New to the team? Create an account</button>
        <div id="authMsg"></div>
      </div>`;
    return `
      <div class="center-wrap">
        <h2>Join the team</h2>
        <p class="sub">Create your account to get started.</p>
        <label>Full Name</label><input id="su_name" placeholder="First and last name">
        <label>Email</label><input id="su_email" type="email" autocomplete="email" placeholder="you@email.com">
        <label>Phone</label><input id="su_phone" type="tel" placeholder="239-555-0123">
        <label>Are you a…?</label>
        <div class="radio-row">
          <button onclick="setRole('RIDER')" id="r_RIDER">Rider</button>
          <button onclick="setRole('PARENT')" id="r_PARENT">Parent /<br>Guardian</button>
          <button onclick="setRole('BOTH')" id="r_BOTH">Both</button>
        </div>
        <div id="roleExtra"></div>
        <label>Choose a PIN (4+ digits)</label>
        <input id="su_pin" type="password" inputmode="numeric" placeholder="••••">
        <button class="btn" onclick="doSignup()">Create Account</button>
        <button class="linkbtn" onclick="window.__authMode='login';render()">Already have an account? Sign in</button>
        <div id="authMsg"></div>
      </div>`;
  },

  /* ---------- home ---------- */
  home: () => {
    let html = '';
    const b = bannerState();
    if (b) {
      html += `<button class="banner ${b.style}" onclick="${b.action}">
        <div class="bicon">${b.emoji}</div>
        <div><div class="t1">${esc(b.title)}</div><div class="t2">${esc(b.note)}</div></div>
      </button>`;
    }
    const tiles = S.tiles.filter(t =>
      t.label !== 'Team Forms' && !(t.visibility === 'admin' && !S.isAdmin));
    html += '<div class="grid">';
    for (const t of tiles) {
      html += `<button class="tile" onclick="tapTile('${t.gid}')">
        <div class="ticon"><img src="${iconFor(t.label, t.icon)}" alt=""></div>
        <span>${esc(t.label.toUpperCase())}</span></button>`;
    }
    if (S.isAdmin) {
      html += `<button class="tile" onclick="go('admin')">
        <div class="ticon"><img src="/icons/files.png" alt=""></div><span>ADMIN</span></button>`;
    }
    return html + '</div>';
  },

  /* ---------- gear ---------- */
  gear: () => {
    const t = S.tiles.find(x => x.label === 'Gear Ordering') || { sub: {} };
    const opt = (label, url) => url && url.startsWith('http')
      ? `<div class="card" onclick="openExternal('${esc(url)}')">
           <div class="cname">${label}</div><div class="cmeta">Opens the vendor's order page</div></div>`
      : `<div class="card flat" style="opacity:.55">
           <div class="cname">${label}</div><div class="cmeta">Coming soon</div></div>`;
    return `<h2>Gear Ordering</h2><p class="sub">Order directly from our vendors.</p>
      ${opt('Gear', t.sub.gear)}
      ${opt('Jerseys &amp; Apparel', t.sub.jerseys)}
      ${opt('Number Plates', t.sub.plates)}`;
  },

  /* ---------- roster ---------- */
  roster: () => {
    if (!S.riders.length && !S.unlinked.length) return '<div class="spinner"></div>';
    let html = `<h2>Team Roster</h2><p class="sub">${S.riders.length} rider${S.riders.length === 1 ? '' : 's'}</p>`;
    for (const r of S.riders) {
      const a = age(r.dob);
      const bits = [r.raceNumber && `#${r.raceNumber}`, r.proficiency, a !== '' && `${a}y`]
        .filter(Boolean).join(' · ');
      let pills = '';
      if (S.isAdmin) {
        pills += r.formStatus === 'Complete'
          ? '<span class="pill ok">FORM ✓</span>' : '<span class="pill wait">FORM</span>';
        pills += r.paymentStatus === 'Paid'
          ? '<span class="pill ok">PAID</span>'
          : r.paymentStatus === 'Verifying'
            ? '<span class="pill wait">VERIFYING</span>'
            : '<span class="pill due">UNPAID</span>';
      }
      html += `<div class="card" onclick="viewRider('${r.gid}')">
        <div class="cname">${esc(r.name)}${pills}</div>
        <div class="cmeta">${esc(bits || 'No details yet')}</div></div>`;
    }
    if (S.isAdmin && S.unlinked.length) {
      html += `<div class="sechead warn">Unlinked accounts (${S.unlinked.length})</div>`;
      for (const u of S.unlinked) {
        html += `<div class="card" onclick="startLink('${u.gid}')">
          <div class="cname">${esc(u.name)}</div>
          <div class="cmeta">${esc(u.email || '')}${u.pendingMatch ? ' · ⚠ ' + esc(u.pendingMatch) : ''}</div>
          <div class="cmeta">Tap to link to a rider</div></div>`;
      }
    }
    return html;
  },

  riderProfile: () => {
    const r = S.viewRider;
    if (!r) return '<div class="empty">Rider not found.</div>';
    const row = (k, v) => v ? `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>` : '';
    const phoneLink = p => p ? `<a href="${telHref(p)}">${esc(fmtPhone(p))}</a>` : '';
    const mailLink = e => e ? `<a href="mailto:${esc(e)}">${esc(e)}</a>` : '';

    let html = `<h2>${esc(r.name)}</h2><p class="sub">${esc(r.nickname || 'Rider profile')}</p>`;
    html += row('Birthday', esc(fmtDate(r.dob)));
    html += row('Age', age(r.dob));
    html += row('Race Number', esc(r.raceNumber));
    html += row('Proficiency', esc(r.proficiency));
    html += row('Email', mailLink(r.email));
    html += row('Phone', phoneLink(r.phone));

    if (r.parents?.length) {
      html += `<div class="sechead">Parents &amp; Guardians</div>`;
      for (const p of r.parents) {
        html += `<div class="card flat">
          <div class="cname">${esc(p.name)}</div>
          ${p.phone ? `<div class="cmeta"><a href="${telHref(p.phone)}">${esc(fmtPhone(p.phone))}</a></div>` : ''}
          ${p.email ? `<div class="cmeta"><a href="mailto:${esc(p.email)}">${esc(p.email)}</a></div>` : ''}

/* ============ banner ============ */
function bannerState() {
  const role = S.user?.role;
  const canSign = role === 'PARENT' || role === 'BOTH' ||
    (role === 'RIDER' && !isMinor(S.fields.DOB));
  if (!canSign) return null;

  if (role === 'RIDER') {
    const done = S.fields.FORM_STATUS === 'Complete';
    const pay = S.fields.PAYMENT_STATUS || 'Unpaid';
    if (!done) return { style: 'orange', emoji: '📋', title: 'Team Forms',
      note: `${S.config.season || '2026-2027'} agreement — start here`, action: "openForms()" };
    if (pay === 'Paid') return null;
    if (pay === 'Verifying') return { style: 'neutral', emoji: '⏳',
      title: 'Payment verification in progress', note: "We'll confirm shortly", action: "openForms()" };
    return { style: 'orange', emoji: '💳', title: 'Payment Needed',
      note: `Team fee $${S.config.feeAmount || '100'} — tap to pay`, action: "openForms()" };
  }
  // Parent / Both: detail lives on the picker screen
  return { style: 'orange', emoji: '📋', title: 'Team Forms',
    note: 'Agreements and team fees for your riders', action: "openForms()" };
}

/* ============ actions ============ */
let ROLE = '';
function setRole(r) {
  ROLE = r;
  for (const x of ['RIDER','PARENT','BOTH'])
    document.getElementById('r_' + x)?.classList.toggle('on', x === r);
  let html = '';
  if (r === 'RIDER') html = `<label>Your Birthdate</label><input id="su_dob" type="date">`;
  if (r === 'PARENT' || r === 'BOTH') {
    html += `<label>Your Rider's Name(s)</label>
      <input id="su_r1" placeholder="Rider 1 full name">
      <input id="su_r2" placeholder="Rider 2 (optional)" style="margin-top:10px">`;
  }
  document.getElementById('roleExtra').innerHTML = html;
}

function setVis(v) {
  document.getElementById('v_public').classList.toggle('on', v === 'public');
  document.getElementById('v_admin').classList.toggle('on', v === 'admin');
}

const msg = (id, text, kind = 'err') => {
  const el = document.getElementById(id);
  if (el) el.innerHTML = `<div class="msg ${kind}">${esc(text)}</div>`;
};

async function doSignup() {
  const name = document.getElementById('su_name').value.trim();
  const email = document.getElementById('su_email').value.trim();
  const phone = document.getElementById('su_phone').value.trim();
  const pin = document.getElementById('su_pin').value.trim();
  const dob = document.getElementById('su_dob')?.value || '';
  const riderNames = [
    document.getElementById('su_r1')?.value.trim(),
    document.getElementById('su_r2')?.value.trim(),
  ].filter(Boolean);

  if (!name || !email || !pin || !ROLE) return msg('authMsg', 'Please fill in every field.');
  if (pin.length < 4) return msg('authMsg', 'PIN must be at least 4 digits.');
  if (ROLE === 'RIDER' && !dob) return msg('authMsg', 'Please enter your birthdate.');
  if ((ROLE === 'PARENT' || ROLE === 'BOTH') && !riderNames.length)
    return msg('authMsg', "Please enter your rider's name.");

  try {
    msg('authMsg', 'Creating your account…', 'ok');
    const r = await api('signup', { name, email, phone, role: ROLE, dob, pin, riderNames });
    S.user = r.user; S.session = r.session;
    const me = await api('me');
    S.fields = me.fields; S.isAdmin = me.user.isAdmin;
    save(); S.history = []; go('home', false);
  } catch (e) { msg('authMsg', e.message); }
}

async function doLogin() {
  const email = document.getElementById('li_email').value.trim();
  const pin = document.getElementById('li_pin').value.trim();
  if (!email || !pin) return msg('authMsg', 'Enter your email and PIN.');
  try {
    msg('authMsg', 'Signing in…', 'ok');
    const r = await api('login', { email, pin });
    S.user = r.user; S.session = r.session;
    const me = await api('me');
    S.fields = me.fields; S.isAdmin = me.user.isAdmin;
    save(); S.history = []; go('home', false);
  } catch (e) { msg('authMsg', e.message); }
}

function logout() {
  clearSave();
  S.user = null; S.session = null; S.fields = {}; S.history = [];
  window.__authMode = 'login';
  go('auth', false);
}

async function tapTile(gid) {
  const t = S.tiles.find(x => x.gid === gid);
  if (!t) return;
  if (t.label === 'Roster') return openRoster();
  if (t.label === 'Sign-Ups') return openSignups();
  if (t.label === 'Gear Ordering') return go('gear');
  if (t.label === 'Team Forms') return openForms();
  if (t.link && t.link.startsWith('http')) return openExternal(t.link);
  alert(`${t.label} isn't set up yet — the link is coming soon.`);
}

async function openRoster() {
  S.riders = []; S.unlinked = []; go('roster');
  try {
    const r = await api('roster');
    S.riders = r.riders; S.unlinked = r.unlinked || [];
    S.riderIndex = r.riderIndex || []; S.isAdmin = r.isAdmin;
  } catch (e) { alert(e.message); }
  render();
}

async function openSignups() {
  S.events = null; go('signups');
  try { S.events = (await api('signupEvents')).events; }
  catch (e) { S.events = []; alert(e.message); }
  render();
}

async function openEvent(gid) {
  S.event = null; go('eventDetail');
  try { S.event = (await api('signupDetail', { eventGid: gid })).event; }
  catch (e) { alert(e.message); goBack(); return; }
  render();
}

async function openForms() {
  S.myRiders = null; go('pickRider');
  try { S.myRiders = (await api('myRiders')).riders; }
  catch (e) { S.myRiders = []; alert(e.message); }
  render();
}

function viewRider(gid) { S.viewRider = S.riders.find(r => r.gid === gid); go('riderProfile'); }
function startLink(gid) { S.linking = S.unlinked.find(u => u.gid === gid); go('linkAccount'); }

async function doLink(parentGid, riderGid) {
  try { await api('adminLink', { parentGid, riderGid }); S.history.pop(); await openRoster(); }
  catch (e) { alert(e.message); }
}
async function unlinkParent(parentGid, riderGid) {
  if (!confirm('Unlink this parent from the rider?')) return;
  try { await api('adminLink', { parentGid, riderGid, unlink: true }); S.history.pop(); await openRoster(); }
  catch (e) { alert(e.message); }
}
async function adminPay(riderGid, unpay) {
  try { await api('adminMarkPaid', { riderGid, unpay }); S.history.pop(); await openRoster(); }
  catch (e) { alert(e.message); }
}

async function saveProfile() {
  const u = {
    PHONE: document.getElementById('p_phone').value.trim(),
    NICKNAME: document.getElementById('p_nick').value.trim(),
    PHONE_PUBLIC: document.getElementById('p_phonePub').classList.contains('on') ? 'true' : 'false',
    EMAIL_PUBLIC: document.getElementById('p_emailPub').classList.contains('on') ? 'true' : 'false',
  };
  const race = document.getElementById('p_race');
  if (race) {
    u.RACE_NUMBER = race.value.trim();
    u.PROFICIENCY = document.getElementById('p_prof').value.trim();
    u.DOB = document.getElementById('p_dob').value;
  }
  try {
    S.fields = (await api('updateProfile', { updates: u })).fields;
    msg('profMsg', 'Saved.', 'ok');
  } catch (e) { msg('profMsg', e.message); }
}

  const e = (S.myRiders || []).find(r => r.gid === riderGid);
  if (!e) return;
  const nm = e.self ? (S.user?.name || '') : e.name;
  FORM = { __target: riderGid, __self: !!e.self, __name: nm, __riderName: nm };
  if (e.self) {
    FORM.nickname = S.fields.NICKNAME || ''; FORM.dob = S.fields.DOB || '';
    FORM.usabmx = S.fields.USABMX || ''; FORM.proficiency = S.fields.PROFICIENCY || '';
    FORM.raceNumber = S.fields.RACE_NUMBER || '';
  }
  window.__formStep = 1;
  go('forms');
}

function formStep(n) {
  if (n === 3) {
    FORM.name = document.getElementById('f_name').value.trim();
    FORM.__riderName = FORM.name;
    FORM.nickname = document.getElementById('f_nick').value.trim();
    FORM.dob = document.getElementById('f_dob').value;
    FORM.usabmx = document.getElementById('f_usabmx').value.trim();
    FORM.proficiency = document.getElementById('f_prof').value;
    FORM.raceNumber = document.getElementById('f_race').value.trim();
    if (!FORM.name || !FORM.dob) return alert('Rider name and birthdate are required.');
  }
  if (n === 4) {
    FORM.emergencyName = document.getElementById('f_emName').value.trim();
    FORM.emergencyPhone = document.getElementById('f_emPhone').value.trim();
    FORM.phonePublic = document.getElementById('f_phonePub').classList.contains('on');
    FORM.emailPublic = document.getElementById('f_emailPub').classList.contains('on');
    if (!FORM.emergencyName || !FORM.emergencyPhone)
      return alert('Emergency contact name and phone are required.');
  }
  window.__formStep = n;
  render();
}

async function submitForm() {
  const sig = document.getElementById('f_sig').value.trim();
  if (sig.length < 3) return msg('formMsg', 'Please type your full name to sign.');
  FORM.signature = sig;
  FORM.signerRole = FORM.__self ? 'Rider 18+' : 'Parent/Guardian';
  const target = FORM.__target;
  try {
    msg('formMsg', 'Submitting…', 'ok');
    const r = await api('submitForm', { riderGid: target, form: FORM });
    if (FORM.__self) S.fields = r.fields;
    window.__formStep = 1; FORM = {};
    msg('formMsg', 'Agreement signed. Now the team fee.', 'ok');
    setTimeout(async () => { await openForms(); openPay(target); }, 1100);
  } catch (e) { msg('formMsg', e.message); }
}

/* ---- payment ---- */
function openPay(riderGid) {
  const r = (S.myRiders || []).find(x => x.gid === riderGid);
  S.payTarget = r || { gid: riderGid, name: 'this rider', paymentStatus: 'Unpaid' };
  go('pay');
}

async function goPay() {
  const url = S.config.payUrl;
  if (!url) return msg('payMsg', 'No payment link is configured yet.');
  try { await api('payOpened', { riderGid: S.payTarget.gid }); } catch {}
  S.payTarget.paymentStatus = 'Verifying';
  openExternal(url);
  msg('payMsg', "Once you've paid, come back and tap “check now”.", 'info');
}

async function recheckPay() {
  try {
    msg('payMsg', 'Checking…', 'info');
    const r = await api('checkPayment', { riderGid: S.payTarget.gid });
    if (r.paid) {
      msg('payMsg', 'Payment confirmed. You‘re all set!', 'ok');
      setTimeout(async () => { S.history = []; await openForms(); }, 1200);
    } else {
      msg('payMsg', "We don't see it yet. Payments can take a few minutes — try again shortly.", 'info');
    }
  } catch (e) { msg('payMsg', e.message); }
}

/* ---- sign-ups ---- */
async function claim(slotGid, release) {
  try {
    await api('claimSlot', { slotGid, userName: S.user.name, release });
    S.event = (await api('signupDetail', { eventGid: S.event.gid })).event;
    render();
  } catch (e) { alert(e.message); }
}

/* ---- admin ---- */
function editTile(gid) { S.editing = S.tiles.find(t => t.gid === gid); go('editTile'); }

async function refreshTiles() {
  const res = await fetch('/api/asana?action=bootstrap');
  const data = await res.json();
  if (res.ok) { S.tiles = data.tiles; S.config = data.config; S.agreement = data.agreement || ''; }
}

async function saveTile() {
  const t = S.editing;
  const u = {
    LINK: document.getElementById('e_link').value.trim(),
    ICON_URL: document.getElementById('e_icon').value.trim(),
    ORDER: document.getElementById('e_order').value,
    VISIBILITY: document.getElementById('v_admin').classList.contains('on') ? 'admin' : 'public',
  };
  if (document.getElementById('e_gear')) {
    u.SUBLINK_GEAR = document.getElementById('e_gear').value.trim();
    u.SUBLINK_JERSEYS = document.getElementById('e_jers').value.trim();
    u.SUBLINK_PLATES = document.getElementById('e_plat').value.trim();
  }
  try {
    msg('tileMsg', 'Saving…', 'ok');
    await api('adminSaveTile', { tileGid: t.gid, updates: u });
    await refreshTiles();
    msg('tileMsg', 'Saved.', 'ok');
  } catch (e) { msg('tileMsg', e.message); }
}

async function openCampaigns() {
  window.__campaigns = null; go('campaigns');
  try { window.__campaigns = (await api('adminZeffyCampaigns')).campaigns; }
  catch (e) { window.__campaigns = []; alert(e.message); }
  render();
}

async function setCampaign(id) {
  try {
    await api('adminSetCampaign', { campaignId: id });
    msg('campMsg', 'Campaign set.', 'ok');
    setTimeout(() => { S.history = []; go('admin', false); }, 900);
  } catch (e) { msg('campMsg', e.message); }
}

async function makeBoard() {
  const eventName = document.getElementById('ev_name').value.trim();
  const date = document.getElementById('ev_date').value;
  const endDate = document.getElementById('ev_end').value;
  const items = document.getElementById('ev_items').value
    .split('\n').map(s => s.trim()).filter(Boolean);
  if (!eventName) return msg('evMsg', 'Give the event a name.');
  try {
    msg('evMsg', 'Creating…', 'ok');
    await api('adminCreateEvent', { eventName, date, endDate, items });
    msg('evMsg', 'Board created.', 'ok');
    setTimeout(async () => { S.history = []; await openSignups(); }, 900);
  } catch (e) { msg('evMsg', e.message); }
}

boot();
</script>
</body>
</html>
