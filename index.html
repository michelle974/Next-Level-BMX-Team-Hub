<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Next Level BMX — Team Hub</title>
<link rel="apple-touch-icon" href="/logo.png">
<style>
  :root {
    --green: #38f100;
    --orange: #ff5500;
    --black: #000000;
    --white: #ffffff;
    --tile: #f0f0f0;
    --line: #dcdcdc;
    --text: #111111;
    --muted: #666666;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--black); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    min-height: 100vh;
    font-size: 17px;
  }
  #app {
    max-width: 560px; margin: 0 auto;
    background: var(--black);
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* ---------- header ---------- */
  header {
    background: var(--black);
    padding-top: env(safe-area-inset-top);
    flex-shrink: 0;
  }
  .head-inner {
    display: grid;
    grid-template-columns: 70px 1fr 70px;
    align-items: center;
    padding: 4px 12px 14px;
  }
  .head-logo { display: flex; justify-content: center; align-items: center; }
  .head-logo img {
    width: 100%; max-width: 260px; height: auto; display: block;
  }
  .head-btn {
    background: none; border: none; color: var(--green);
    font-size: 16px; font-weight: 700; padding: 10px 2px; cursor: pointer;
    font-family: inherit;
  }
  .head-btn.right { text-align: right; }
  .head-btn:disabled { opacity: 0; pointer-events: none; }
  .accent { height: 5px; background: var(--green); }

  /* ---------- body ---------- */
  main {
    background: var(--white);
    padding: 22px 18px 30px;
    flex: 1;
    display: flex; flex-direction: column;
  }
  .footer-band {
    background: var(--black);
    height: 34px; flex-shrink: 0;
    padding-bottom: env(safe-area-inset-bottom);
  }

  h2 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 16px; margin: 0 0 22px; line-height: 1.4; }

  /* ---------- centered auth ---------- */
  .center-wrap {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 10px 0 30px;
  }
  .center-wrap h2 { font-size: 30px; text-align: center; }
  .center-wrap .sub { text-align: center; font-size: 17px; }

  /* ---------- forms banner ---------- */
  .banner {
    display: flex; align-items: center; gap: 14px;
    background: var(--orange); border-radius: 16px;
    padding: 16px 18px; margin-bottom: 24px;
    cursor: pointer; border: none; width: 100%; text-align: left;
    font-family: inherit;
  }
  .banner .bicon {
    width: 50px; height: 50px; background: #fff; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .banner svg { stroke: var(--orange); fill: none; stroke-width: 1.8; width: 27px; height: 27px; }
  .banner .t1 { color: #fff; font-size: 18px; font-weight: 800; }
  .banner .t2 { color: #fff; font-size: 14px; opacity: .95; margin-top: 2px; }

  /* ---------- tiles ---------- */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px 10px; }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 11px;
    background: none; border: none; padding: 0; cursor: pointer; font-family: inherit;
  }
  .tile:active { transform: scale(.94); }
  .ticon {
    width: 78px; height: 78px; background: var(--tile); border-radius: 20px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .ticon img { width: 100%; height: 100%; object-fit: cover; }
  .ticon svg { stroke: var(--black); fill: none; stroke-width: 1.5; width: 38px; height: 38px; }
  .tile span {
    font-size: 13.5px; font-weight: 700; text-align: center;
    color: var(--text); line-height: 1.25;
  }

  /* ---------- inputs ---------- */
  label { display: block; font-size: 15px; font-weight: 700; margin: 20px 0 7px; }
  input, select, textarea {
    width: 100%; padding: 15px; font-size: 17px; font-family: inherit;
    border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--green); }
  .btn {
    width: 100%; padding: 17px; margin-top: 26px; font-size: 18px; font-weight: 800;
    background: var(--black); color: var(--green); border: none; border-radius: 14px;
    cursor: pointer; font-family: inherit;
  }
  .btn:active { opacity: .85; }
  .btn.alt { background: var(--tile); color: var(--text); }
  .btn.slim { padding: 13px; font-size: 15px; margin-top: 14px; }
  .btn.tiny { width: auto; padding: 10px 16px; font-size: 14px; margin: 0; }
  .linkbtn {
    background: none; border: none; color: var(--muted); font-size: 16px;
    text-decoration: underline; cursor: pointer; margin-top: 20px;
    width: 100%; font-family: inherit; padding: 10px;
  }
  .radio-row { display: flex; gap: 9px; margin-top: 8px; }
  .radio-row button {
    flex: 1; padding: 14px 4px; font-size: 15px; font-weight: 700;
    border: 2px solid var(--line); border-radius: 12px; background: #fff;
    cursor: pointer; font-family: inherit; color: var(--text);
  }
  .radio-row button.on { background: var(--black); color: var(--green); border-color: var(--black); }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; border-bottom: 1px solid var(--line); gap: 14px;
  }
  .toggle-row .tl { font-size: 16px; font-weight: 600; }
  .toggle-row .tn { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
  .switch {
    width: 54px; height: 32px; border-radius: 16px; background: #ccc;
    border: none; position: relative; cursor: pointer; flex-shrink: 0;
  }
  .switch.on { background: var(--green); }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px;
    border-radius: 50%; background: #fff; transition: transform .15s;
  }
  .switch.on::after { transform: translateX(22px); }

  /* ---------- cards ---------- */
  .card {
    border: 2px solid var(--line); border-radius: 14px; padding: 17px;
    margin-bottom: 12px; background: #fff; cursor: pointer;
  }
  .card.flat { cursor: default; }
  .card .cname { font-size: 18px; font-weight: 700; }
  .card .cmeta { font-size: 14.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .pill {
    display: inline-block; font-size: 11.5px; font-weight: 800; padding: 4px 10px;
    border-radius: 20px; margin-left: 8px; vertical-align: middle;
  }
  .pill.ok { background: #e4ffd9; color: #2a7000; }
  .pill.wait { background: #fff0e0; color: #a34e00; }

  .kv {
    display: flex; justify-content: space-between; padding: 15px 0;
    border-bottom: 1px solid var(--line); font-size: 16.5px; gap: 14px;
  }
  .kv .k { color: var(--muted); flex-shrink: 0; }
  .kv .v { font-weight: 600; text-align: right; word-break: break-word; }

  .sechead {
    font-size: 14px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted);
    margin: 30px 0 12px;
  }
  .sechead.warn { color: var(--orange); }

  .agreement {
    max-height: 320px; overflow-y: auto; border: 2px solid var(--line);
    border-radius: 12px; padding: 17px; font-size: 15px; line-height: 1.6;
    background: #fafafa; margin-top: 10px;
  }
  .agreement h4 { margin: 18px 0 6px; font-size: 16px; }
  .agreement h4:first-child { margin-top: 0; }
  .agreement ul { margin: 6px 0; padding-left: 20px; }
  .agreement li { margin-bottom: 6px; }

  .msg { padding: 14px 16px; border-radius: 12px; font-size: 15.5px; margin-top: 18px; line-height: 1.45; }
  .msg.err { background: #ffe8e8; color: #a00; }
  .msg.ok { background: #e4ffd9; color: #2a7000; }
  .empty { text-align: center; color: var(--muted); font-size: 16.5px; padding: 50px 20px; line-height: 1.5; }
  .spinner {
    width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--green);
    border-radius: 50%; animation: spin .7s linear infinite; margin: 60px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .steps { font-size: 13.5px; color: var(--muted); font-weight: 800; letter-spacing: .05em; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="head-inner">
      <button class="head-btn" id="backBtn" onclick="goBack()">‹ Back</button>
      <div class="head-logo"><img src="/logo.png" alt="Next Level BMX"></div>
      <button class="head-btn right" id="menuBtn" onclick="go('profile')">Me</button>
    </div>
    <div class="accent"></div>
  </header>
  <main id="view"><div class="spinner"></div></main>
  <div class="footer-band"></div>
</div>

<script>
/* ============ state ============ */
const S = {
  user: null, session: null, fields: {},
  tiles: [], config: {}, riders: [], unlinked: [], riderIndex: [],
  events: null, myRiders: null,
  isAdmin: false, screen: 'loading', history: [],
  viewRider: null, editing: null, linking: null,
};

const api = async (action, payload = {}) => {
  const res = await fetch('/api/asana', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, gid: S.user?.gid, session: S.session, ...payload }),
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || 'Something went wrong.');
  return json;
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const save = () => localStorage.setItem('nlbmx_hub',
  JSON.stringify({ gid: S.user?.gid, session: S.session }));
const clearSave = () => localStorage.removeItem('nlbmx_hub');

function age(dob) {
  if (!dob) return '';
  const b = new Date(dob); if (isNaN(b)) return '';
  const t = new Date();
  let a = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
  return a;
}
const isMinor = dob => { const a = age(dob); return a !== '' && a < 18; };

/* ============ icons ============ */
const ICONS = {
  'Team Forms': '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>',
  'Schedule': '<rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="7" y1="2" x2="7" y2="6"/><line x1="17" y1="2" x2="17" y2="6"/>',
  'Roster': '<circle cx="12" cy="8" r="3.5"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/>',
  'Training App': '<circle cx="12" cy="12" r="9"/><path d="M8 12l2.5 2.5L16 9"/>',
  'Chat': '<path d="M4 4h16v12H7l-3 3z"/>',
  'Sponsorship': '<path d="M12 21s-7-4.35-9.5-8.5C.7 8.5 3 4.8 6.5 4.8c1.9 0 3.2 1 4 2.2.8-1.2 2.1-2.2 4-2.2 3.5 0 5.8 3.7 4 7.7C19 16.65 12 21 12 21z"/>',
  'Training Payments': '<rect x="2.5" y="5" width="19" height="14" rx="2"/><line x1="2.5" y1="10" x2="21.5" y2="10"/>',
  'Gear Ordering': '<path d="M6 8l1-4h10l1 4"/><rect x="4" y="8" width="16" height="13" rx="2"/><path d="M9 12a3 3 0 0 0 6 0"/>',
  'Photo Sharing': '<rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/>',
  'Sign-Ups': '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3h6v3H9z"/><path d="M8 13l2.5 2.5L16 10"/>',
  'Race Stats': '<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>',
  'Files': '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  'Socials': '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/>',
  'Admin': '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
};
const iconSvg = label => `<svg viewBox="0 0 24 24">${ICONS[label] || ICONS['Files']}</svg>`;

/* ============ nav ============ */
function go(screen, push = true) {
  if (push && S.screen !== screen) S.history.push(S.screen);
  S.screen = screen;
  render();
}
function goBack() {
  S.screen = S.history.pop() || 'home';
  render();
}

/* ============ boot ============ */
async function boot() {
  try {
    const res = await fetch('/api/asana?action=bootstrap');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    S.tiles = data.tiles || [];
    S.config = data.config || {};
  } catch (e) {
    document.getElementById('view').innerHTML =
      `<div class="msg err">Couldn't reach the server.<br><small>${esc(e.message)}</small></div>`;
    return;
  }

  const saved = JSON.parse(localStorage.getItem('nlbmx_hub') || 'null');
  if (saved?.gid && saved?.session) {
    try {
      S.session = saved.session;
      S.user = { gid: saved.gid };
      const me = await api('me');
      S.user = me.user; S.fields = me.fields; S.isAdmin = me.user.isAdmin;
      S.screen = 'home';
    } catch {
      clearSave(); S.user = null; S.session = null; S.screen = 'auth';
    }
  } else {
    S.screen = 'auth';
  }
  render();
}

/* ============ render ============ */
function render() {
  const v = document.getElementById('view');
  document.getElementById('backBtn').disabled =
    ['auth', 'home', 'loading'].includes(S.screen);
  document.getElementById('menuBtn').disabled =
    ['auth', 'loading'].includes(S.screen);
  v.innerHTML = (SCREENS[S.screen] || SCREENS.home)();
  window.scrollTo(0, 0);
}

const SCREENS = {
  loading: () => '<div class="spinner"></div>',

  /* ---------- auth ---------- */
  auth: () => {
    const m = window.__authMode || 'login';
    if (m === 'login') return `
      <div class="center-wrap">
        <h2>Welcome back</h2>
        <p class="sub">Sign in with your email and PIN.</p>
        <label>Email</label>
        <input id="li_email" type="email" autocomplete="email" placeholder="you@email.com">
        <label>PIN</label>
        <input id="li_pin" type="password" inputmode="numeric" placeholder="••••">
        <button class="btn" onclick="doLogin()">Sign In</button>
        <button class="linkbtn" onclick="window.__authMode='signup';render()">New to the team? Create an account</button>
        <div id="authMsg"></div>
      </div>`;
    return `
      <div class="center-wrap">
        <h2>Join the team</h2>
        <p class="sub">Create your account to get started.</p>
        <label>Full Name</label>
        <input id="su_name" placeholder="First and last name">
        <label>Email</label>
        <input id="su_email" type="email" autocomplete="email" placeholder="you@email.com">
        <label>Phone</label>
        <input id="su_phone" type="tel" autocomplete="tel" placeholder="(239) 555-0123">
        <label>Are you a…?</label>
        <div class="radio-row">
          <button onclick="setRole('RIDER')" id="r_RIDER">Rider</button>
          <button onclick="setRole('PARENT')" id="r_PARENT">Parent/<br>Guardian</button>
          <button onclick="setRole('BOTH')" id="r_BOTH">Both</button>
        </div>
        <div id="roleExtra"></div>
        <label>Choose a PIN (4+ digits)</label>
        <input id="su_pin" type="password" inputmode="numeric" placeholder="••••">
        <button class="btn" onclick="doSignup()">Create Account</button>
        <button class="linkbtn" onclick="window.__authMode='login';render()">Already have an account? Sign in</button>
        <div id="authMsg"></div>
      </div>`;
  },

  /* ---------- home ---------- */
  home: () => {
    const role = S.user?.role;
    const showForms = role === 'PARENT' || role === 'BOTH' ||
      (role === 'RIDER' && !isMinor(S.fields.DOB));
    const done = S.fields.FORM_STATUS === 'Complete';

    let html = '';
    if (showForms && !(role === 'RIDER' && done)) {
      html += `<button class="banner" onclick="openForms()">
        <div class="bicon"><svg viewBox="0 0 24 24">${ICONS['Team Forms']}</svg></div>
        <div><div class="t1">Team Forms</div>
        <div class="t2">${esc(S.config.season || '2026-2027')} agreement — start here</div></div>
      </button>`;
    }

    const tiles = S.tiles.filter(t =>
      t.label !== 'Team Forms' && !(t.visibility === 'admin' && !S.isAdmin));

    html += '<div class="grid">';
    for (const t of tiles) {
      const inner = t.icon ? `<img src="${esc(t.icon)}" alt="">` : iconSvg(t.label);
      html += `<button class="tile" onclick="tapTile('${t.gid}')">
        <div class="ticon">${inner}</div>
        <span>${esc(t.label.toUpperCase())}</span>
      </button>`;
    }
    if (S.isAdmin) {
      html += `<button class="tile" onclick="go('admin')">
        <div class="ticon">${iconSvg('Admin')}</div><span>ADMIN</span></button>`;
    }
    html += '</div>';
    return html;
  },

  /* ---------- gear ---------- */
  gear: () => {
    const t = S.tiles.find(x => x.label === 'Gear Ordering') || { sub: {} };
    const opt = (label, url) => url && url.startsWith('http')
      ? `<div class="card" onclick="window.open('${esc(url)}','_blank')">
           <div class="cname">${label}</div><div class="cmeta">Opens the vendor's order page</div></div>`
      : `<div class="card flat" style="opacity:.55">
           <div class="cname">${label}</div><div class="cmeta">Coming soon</div></div>`;
    return `<h2>Gear Ordering</h2>
      <p class="sub">Order directly from our vendors.</p>
      ${opt('Gear', t.sub.gear)}
      ${opt('Jerseys &amp; Apparel', t.sub.jerseys)}
      ${opt('Number Plates', t.sub.plates)}`;
  },

  /* ---------- roster ---------- */
  roster: () => {
    if (!S.riders.length && !S.unlinked.length) return '<div class="spinner"></div>';
    let html = `<h2>Team Roster</h2><p class="sub">${S.riders.length} rider${S.riders.length === 1 ? '' : 's'}</p>`;
    for (const r of S.riders) {
      const a = age(r.dob);
      const bits = [r.raceNumber && `#${r.raceNumber}`, r.proficiency, a !== '' && `${a}y`]
        .filter(Boolean).join(' · ');
      const pill = S.isAdmin
        ? (r.formStatus === 'Complete'
            ? '<span class="pill ok">FORM ✓</span>'
            : '<span class="pill wait">PENDING</span>')
        : '';
      html += `<div class="card" onclick="viewRider('${r.gid}')">
        <div class="cname">${esc(r.name)}${pill}</div>
        <div class="cmeta">${esc(bits || 'No details yet')}</div>
      </div>`;
    }
    if (S.isAdmin && S.unlinked.length) {
      html += `<div class="sechead warn">Unlinked accounts (${S.unlinked.length})</div>`;
      for (const u of S.unlinked) {
        html += `<div class="card" onclick="startLink('${u.gid}')">
          <div class="cname">${esc(u.name)}</div>
          <div class="cmeta">${esc(u.email || '')}${u.pendingMatch ? ' · ⚠ ' + esc(u.pendingMatch) : ''}</div>
          <div class="cmeta">Tap to link to a rider</div>
        </div>`;
      }
    }
    return html;
  },

  riderProfile: () => {
    const r = S.viewRider;
    if (!r) return '<div class="empty">Rider not found.</div>';
    const row = (k, v) => v ? `<div class="kv"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>` : '';
    let html = `<h2>${esc(r.name)}</h2><p class="sub">${esc(r.nickname || 'Rider profile')}</p>`;
    html += row('Birthday', r.dob);
    html += row('Age', age(r.dob));
    html += row('Race Number', r.raceNumber);
    html += row('Proficiency', r.proficiency);
    html += row('Email', r.email);
    html += row('Phone', r.phone);

    if (r.parents && r.parents.length) {
      html += `<div class="sechead">Parents &amp; Guardians</div>`;
      for (const p of r.parents) {
        const c = [p.phone, p.email].filter(Boolean).join(' · ');
        html += `<div class="card flat">
          <div class="cname">${esc(p.name)}</div>
          <div class="cmeta">${esc(c || 'Contact info is private')}</div>
          ${S.isAdmin ? `<button class="btn tiny alt" style="margin-top:12px"
             onclick="unlinkParent('${p.gid}','${r.gid}')">Unlink</button>` : ''}
        </div>`;
      }
    }

    if (S.isAdmin) {
      html += `<div class="sechead warn">Coaches only</div>`;
      html += row('USA BMX #', r.usabmx);
      html += row('Emergency Contact', r.emergencyContact);
      html += row('Emergency Phone', r.emergencyPhone);
      html += row('Form Status', r.formStatus);
      if (r.pendingMatch) html += row('⚠ Pending Match', r.pendingMatch);
    }
    return html;
  },

  linkAccount: () => {
    const u = S.linking;
    if (!u) return '<div class="empty">Account not found.</div>';
    let html = `<h2>Link ${esc(u.name)}</h2>
      <p class="sub">Choose the rider this account belongs to.</p>`;
    if (u.pendingMatch) {
      html += `<div class="msg err">Suggested match: ${esc(u.pendingMatch)}</div>`;
    }
    for (const r of S.riderIndex) {

/* ============ actions ============ */
let ROLE = '';
function setRole(r) {
  ROLE = r;
  for (const x of ['RIDER', 'PARENT', 'BOTH']) {
    document.getElementById('r_' + x)?.classList.toggle('on', x === r);
  }
  let html = '';
  if (r === 'RIDER') html = `<label>Your Birthdate</label><input id="su_dob" type="date">`;
  if (r === 'PARENT' || r === 'BOTH') {
    html += `<label>Your Rider's Name(s)</label>
      <input id="su_r1" placeholder="Rider 1 full name">
      <input id="su_r2" placeholder="Rider 2 (optional)" style="margin-top:10px">`;
  }
  document.getElementById('roleExtra').innerHTML = html;
}

function setVis(v) {
  document.getElementById('v_public').classList.toggle('on', v === 'public');
  document.getElementById('v_admin').classList.toggle('on', v === 'admin');
}

const msg = (id, text, kind = 'err') => {
  const el = document.getElementById(id);
  if (el) el.innerHTML = `<div class="msg ${kind}">${esc(text)}</div>`;
};

async function doSignup() {
  const name = document.getElementById('su_name').value.trim();
  const email = document.getElementById('su_email').value.trim();
  const phone = document.getElementById('su_phone').value.trim();
  const pin = document.getElementById('su_pin').value.trim();
  const dob = document.getElementById('su_dob')?.value || '';
  const riderNames = [
    document.getElementById('su_r1')?.value.trim(),
    document.getElementById('su_r2')?.value.trim(),
  ].filter(Boolean);

  if (!name || !email || !pin || !ROLE) return msg('authMsg', 'Please fill in every field.');
  if (pin.length < 4) return msg('authMsg', 'PIN must be at least 4 digits.');
  if (ROLE === 'RIDER' && !dob) return msg('authMsg', 'Please enter your birthdate.');
  if ((ROLE === 'PARENT' || ROLE === 'BOTH') && !riderNames.length)
    return msg('authMsg', "Please enter your rider's name.");

  try {
    msg('authMsg', 'Creating your account…', 'ok');
    const r = await api('signup', { name, email, phone, role: ROLE, dob, pin, riderNames });
    S.user = r.user; S.session = r.session;
    const me = await api('me');
    S.fields = me.fields; S.isAdmin = me.user.isAdmin;
    save();
    S.history = [];
    go('home', false);
  } catch (e) { msg('authMsg', e.message); }
}

async function doLogin() {
  const email = document.getElementById('li_email').value.trim();
  const pin = document.getElementById('li_pin').value.trim();
  if (!email || !pin) return msg('authMsg', 'Enter your email and PIN.');
  try {
    msg('authMsg', 'Signing in…', 'ok');
    const r = await api('login', { email, pin });
    S.user = r.user; S.session = r.session;
    const me = await api('me');
    S.fields = me.fields; S.isAdmin = me.user.isAdmin;
    save();
    S.history = [];
    go('home', false);
  } catch (e) { msg('authMsg', e.message); }
}

function logout() {
  clearSave();
  S.user = null; S.session = null; S.fields = {}; S.history = [];
  window.__authMode = 'login';
  go('auth', false);
}

async function tapTile(gid) {
  const t = S.tiles.find(x => x.gid === gid);
  if (!t) return;
  if (t.label === 'Roster') return openRoster();
  if (t.label === 'Sign-Ups') return openSignups();
  if (t.label === 'Gear Ordering') return go('gear');
  if (t.label === 'Team Forms') return openForms();
  if (t.link && t.link.startsWith('http')) return window.open(t.link, '_blank');
  alert(`${t.label} isn't set up yet — the link is coming soon.`);
}

async function openRoster() {
  S.riders = []; S.unlinked = [];
  go('roster');
  try {
    const r = await api('roster');
    S.riders = r.riders; S.unlinked = r.unlinked || [];
    S.riderIndex = r.riderIndex || []; S.isAdmin = r.isAdmin;
  } catch (e) { alert(e.message); }
  render();
}

async function openSignups() {
  S.events = null;
  go('signups');
  try {
    const r = await api('signups');
    S.events = r.events;
  } catch (e) { S.events = []; alert(e.message); }
  render();
}

async function openForms() {
  S.myRiders = null;
  go('pickRider');
  try {
    const r = await api('myRiders');
    S.myRiders = r.riders;
  } catch (e) { S.myRiders = []; alert(e.message); }
  render();
}

function viewRider(gid) {
  S.viewRider = S.riders.find(r => r.gid === gid);
  go('riderProfile');
}

function startLink(gid) {
  S.linking = S.unlinked.find(u => u.gid === gid);
  go('linkAccount');
}

async function doLink(parentGid, riderGid) {
  try {
    await api('adminLink', { parentGid, riderGid });
    S.history.pop();
    await openRoster();
  } catch (e) { alert(e.message); }
}

async function unlinkParent(parentGid, riderGid) {
  if (!confirm('Unlink this parent from the rider?')) return;
  try {
    await api('adminLink', { parentGid, riderGid, unlink: true });
    S.history.pop();
    await openRoster();
  } catch (e) { alert(e.message); }
}

async function saveProfile() {
  const u = {
    PHONE: document.getElementById('p_phone').value.trim(),
    NICKNAME: document.getElementById('p_nick').value.trim(),
    PHONE_PUBLIC: document.getElementById('p_phonePub').classList.contains('on') ? 'true' : 'false',
    EMAIL_PUBLIC: document.getElementById('p_emailPub').classList.contains('on') ? 'true' : 'false',
  };
  const race = document.getElementById('p_race');
  if (race) {
    u.RACE_NUMBER = race.value.trim();
    u.PROFICIENCY = document.getElementById('p_prof').value.trim();
  }
  try {
    const r = await api('updateProfile', { updates: u });
    S.fields = r.fields;
    msg('profMsg', 'Saved.', 'ok');
  } catch (e) { msg('profMsg', e.message); }
}

/* ---- forms ---- */
let FORM = {};

function startForm(riderGid) {
  const entry = (S.myRiders || []).find(r => r.gid === riderGid);
  if (!entry) return;
  const plainName = entry.self ? (S.user?.name || '') : entry.name;
  FORM = {
    __target: riderGid,
    __self: !!entry.self,
    __name: plainName,
    __riderName: plainName,
  };
  if (entry?.self) {
    FORM.nickname = S.fields.NICKNAME || '';
    FORM.dob = S.fields.DOB || '';
    FORM.usabmx = S.fields.USABMX || '';
    FORM.proficiency = S.fields.PROFICIENCY || '';
    FORM.raceNumber = S.fields.RACE_NUMBER || '';
  }
  window.__formStep = 1;
  go('forms');
}

function formStep(n) {
  if (n === 3) {
    FORM.name = document.getElementById('f_name').value.trim();
    FORM.__riderName = FORM.name;
    FORM.nickname = document.getElementById('f_nick').value.trim();
    FORM.dob = document.getElementById('f_dob').value;
    FORM.usabmx = document.getElementById('f_usabmx').value.trim();
    FORM.proficiency = document.getElementById('f_prof').value;
    FORM.raceNumber = document.getElementById('f_race').value.trim();
    if (!FORM.name || !FORM.dob) return alert('Rider name and birthdate are required.');
  }
  if (n === 4) {
    FORM.emergencyName = document.getElementById('f_emName').value.trim();
    FORM.emergencyPhone = document.getElementById('f_emPhone').value.trim();
    FORM.phonePublic = document.getElementById('f_phonePub').classList.contains('on');
    FORM.emailPublic = document.getElementById('f_emailPub').classList.contains('on');
    if (!FORM.emergencyName || !FORM.emergencyPhone)
      return alert('Emergency contact name and phone are required.');
  }
  window.__formStep = n;
  render();
}

async function submitForm() {
  const sig = document.getElementById('f_sig').value.trim();
  if (sig.length < 3) return msg('formMsg', 'Please type your full name to sign.');
  FORM.signature = sig;
  FORM.signerRole = FORM.__self ? 'Rider 18+' : 'Parent/Guardian';
  try {
    msg('formMsg', 'Submitting…', 'ok');
    const r = await api('submitForm', { riderGid: FORM.__target, form: FORM });
    if (FORM.__self) S.fields = r.fields;
    window.__formStep = 1; FORM = {};
    msg('formMsg', 'Agreement signed. Thank you!', 'ok');
    setTimeout(() => { S.history = []; go('home', false); }, 1200);
  } catch (e) { msg('formMsg', e.message); }
}

/* ---- sign-ups ---- */
async function claim(slotGid, release) {
  try {
    await api('claimSlot', { slotGid, userName: S.user.name, release });
    const r = await api('signups');
    S.events = r.events;
    render();
  } catch (e) { alert(e.message); }
}

/* ---- admin ---- */
function editTile(gid) {
  S.editing = S.tiles.find(t => t.gid === gid);
  go('editTile');
}

async function refreshTiles() {
  const res = await fetch('/api/asana?action=bootstrap');
  const data = await res.json();
  if (res.ok) S.tiles = data.tiles;
}

async function saveTile() {
  const t = S.editing;
  const u = {
    LINK: document.getElementById('e_link').value.trim(),
    ICON_URL: document.getElementById('e_icon').value.trim(),
    ORDER: document.getElementById('e_order').value,
    VISIBILITY: document.getElementById('v_admin').classList.contains('on') ? 'admin' : 'public',
  };
  if (document.getElementById('e_gear')) {
    u.SUBLINK_GEAR = document.getElementById('e_gear').value.trim();
    u.SUBLINK_JERSEYS = document.getElementById('e_jers').value.trim();
    u.SUBLINK_PLATES = document.getElementById('e_plat').value.trim();
  }
  try {
    msg('tileMsg', 'Saving…', 'ok');
    await api('adminSaveTile', { tileGid: t.gid, updates: u });
    await refreshTiles();
    msg('tileMsg', 'Saved.', 'ok');
  } catch (e) { msg('tileMsg', e.message); }
}

// NOTE: named makeBoard, not createEvent — document.createEvent is a browser
// built-in and inline onclick resolves it first, which silently breaks the button.
async function makeBoard() {
  const eventName = document.getElementById('ev_name').value.trim();
  const date = document.getElementById('ev_date').value;
  const items = document.getElementById('ev_items').value
    .split('\n').map(s => s.trim()).filter(Boolean);
  if (!eventName) return msg('evMsg', 'Give the event a name.');
  try {
    msg('evMsg', 'Creating…', 'ok');
    await api('adminCreateEvent', { eventName, date, items });
    msg('evMsg', 'Board created.', 'ok');
    setTimeout(() => { S.history = []; go('admin', false); }, 900);
  } catch (e) { msg('evMsg', e.message); }
}

boot();
</script>
