<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Next Level BMX — Team Hub</title>
<link rel="apple-touch-icon" href="/logo.png">
<style>
  :root {
    --green: #38f100;
    --orange: #ff5500;
    --black: #000000;
    --white: #ffffff;
    --tile: #f2f2f2;
    --line: #e2e2e2;
    --text: #111111;
    --muted: #6b6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--black);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    min-height: 100vh;
  }
  #app { max-width: 520px; margin: 0 auto; background: var(--black); min-height: 100vh; }

  /* ---- header ---- */
  header {
    background: var(--black);
    padding: env(safe-area-inset-top) 0 0;
    border-bottom: 4px solid var(--green);
  }
  .head-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px 12px; gap: 10px;
  }
  .head-logo { flex: 1; display: flex; justify-content: center; }
  .head-logo img { height: 62px; width: auto; display: block; }
  .head-btn {
    background: none; border: none; color: var(--green);
    font-size: 13px; font-weight: 700; padding: 8px; cursor: pointer;
    min-width: 54px;
  }
  .head-btn:disabled { opacity: 0; pointer-events: none; }

  /* ---- body ---- */
  main { background: var(--white); padding: 18px 16px 40px; min-height: calc(100vh - 100px); }

  h2 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }

  /* ---- tiles ---- */
  .banner {
    display: flex; align-items: center; gap: 12px;
    background: var(--orange); border-radius: 14px;
    padding: 13px 15px; margin-bottom: 20px;
    cursor: pointer; border: none; width: 100%; text-align: left;
  }
  .banner .bicon {
    width: 42px; height: 42px; background: #fff; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .banner svg { stroke: var(--orange); fill: none; stroke-width: 1.8; width: 22px; height: 22px; }
  .banner .t1 { color: #fff; font-size: 14px; font-weight: 700; }
  .banner .t2 { color: #fff; font-size: 11.5px; opacity: .92; margin-top: 1px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 8px; }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: none; border: none; padding: 0; cursor: pointer; font-family: inherit;
  }
  .tile:active { transform: scale(.94); }
  .ticon {
    width: 60px; height: 60px; background: var(--tile); border-radius: 16px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .ticon img { width: 100%; height: 100%; object-fit: cover; }
  .ticon svg { stroke: var(--black); fill: none; stroke-width: 1.6; width: 28px; height: 28px; }
  .tile span {
    font-size: 10.5px; font-weight: 700; text-align: center;
    color: var(--text); line-height: 1.22; letter-spacing: .01em;
  }

  /* ---- forms ---- */
  label { display: block; font-size: 12px; font-weight: 700; margin: 14px 0 5px; }
  input, select, textarea {
    width: 100%; padding: 12px; font-size: 16px; font-family: inherit;
    border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--green); }
  .btn {
    width: 100%; padding: 14px; margin-top: 20px; font-size: 15px; font-weight: 800;
    background: var(--black); color: var(--green); border: none; border-radius: 12px;
    cursor: pointer; font-family: inherit; letter-spacing: .02em;
  }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.alt { background: var(--tile); color: var(--text); }
  .btn.slim { padding: 10px; font-size: 13px; margin-top: 10px; }
  .linkbtn {
    background: none; border: none; color: var(--muted); font-size: 13px;
    text-decoration: underline; cursor: pointer; margin-top: 16px;
    width: 100%; font-family: inherit; padding: 8px;
  }
  .radio-row { display: flex; gap: 8px; margin-top: 6px; }
  .radio-row button {
    flex: 1; padding: 11px 4px; font-size: 12.5px; font-weight: 700;
    border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
    cursor: pointer; font-family: inherit; color: var(--text);
  }
  .radio-row button.on { background: var(--black); color: var(--green); border-color: var(--black); }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .toggle-row .tl { font-size: 13px; font-weight: 600; }
  .toggle-row .tn { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .switch { width: 46px; height: 27px; border-radius: 14px; background: #ccc;
    border: none; position: relative; cursor: pointer; flex-shrink: 0; }
  .switch.on { background: var(--green); }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px;
    border-radius: 50%; background: #fff; transition: transform .15s;
  }
  .switch.on::after { transform: translateX(19px); }

  /* ---- lists ---- */
  .card {
    border: 1.5px solid var(--line); border-radius: 12px; padding: 14px;
    margin-bottom: 10px; background: #fff; cursor: pointer;
  }
  .card .cname { font-size: 15px; font-weight: 700; }
  .card .cmeta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .pill {
    display: inline-block; font-size: 10px; font-weight: 800; padding: 3px 8px;
    border-radius: 20px; margin-left: 6px; vertical-align: middle;
  }
  .pill.ok { background: #e4ffd9; color: #2a7000; }
  .pill.wait { background: #fff0e0; color: #a34e00; }

  .kv { display: flex; justify-content: space-between; padding: 11px 0;
        border-bottom: 1px solid var(--line); font-size: 13.5px; gap: 12px; }
  .kv .k { color: var(--muted); flex-shrink: 0; }
  .kv .v { font-weight: 600; text-align: right; word-break: break-word; }

  .agreement {
    max-height: 300px; overflow-y: auto; border: 1.5px solid var(--line);
    border-radius: 10px; padding: 14px; font-size: 12.5px; line-height: 1.55;
    background: #fafafa; margin-top: 8px;
  }
  .agreement h4 { margin: 14px 0 5px; font-size: 13px; }
  .agreement h4:first-child { margin-top: 0; }
  .agreement ul { margin: 5px 0; padding-left: 18px; }
  .agreement li { margin-bottom: 4px; }

  .msg { padding: 11px 13px; border-radius: 10px; font-size: 13px; margin-top: 14px; }
  .msg.err { background: #ffe8e8; color: #a00; }
  .msg.ok { background: #e4ffd9; color: #2a7000; }
  .empty { text-align: center; color: var(--muted); font-size: 13.5px; padding: 40px 20px; }
  .spinner {
    width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--green);
    border-radius: 50%; animation: spin .7s linear infinite; margin: 50px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .steps { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="head-inner">
      <button class="head-btn" id="backBtn" onclick="goBack()">‹ Back</button>
      <div class="head-logo"><img src="/logo.png" alt="Next Level BMX"></div>
      <button class="head-btn" id="menuBtn" onclick="go('profile')">Me</button>
    </div>
  </header>
  <main id="view"><div class="spinner"></div></main>
</div>

<script>
/* ============ state ============ */
const S = {
  user: null, session: null, fields: {},
  tiles: [], config: {}, riders: [], events: [],
  isAdmin: false, screen: 'loading', history: [],
  formRider: null, viewRider: null,
};

const api = async (action, payload = {}) => {
  const res = await fetch('/api/asana', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, gid: S.user?.gid, session: S.session, ...payload }),
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || 'Something went wrong.');
  return json;
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const save = () => localStorage.setItem('nlbmx_hub',
  JSON.stringify({ gid: S.user?.gid, session: S.session }));
const clearSave = () => localStorage.removeItem('nlbmx_hub');

function age(dob) {
  if (!dob) return '';
  const b = new Date(dob); if (isNaN(b)) return '';
  const t = new Date();
  let a = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
  return a;
}
const isMinor = dob => { const a = age(dob); return a !== '' && a < 18; };

/* ============ icons ============ */
const ICONS = {
  'Team Forms': '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>',
  'Schedule': '<rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="7" y1="2" x2="7" y2="6"/><line x1="17" y1="2" x2="17" y2="6"/>',
  'Roster': '<circle cx="12" cy="8" r="3.5"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/>',
  'Training App': '<circle cx="12" cy="12" r="9"/><path d="M8 12l2.5 2.5L16 9"/>',
  'Chat': '<path d="M4 4h16v12H7l-3 3z"/>',
  'Sponsorship': '<path d="M12 21s-7-4.35-9.5-8.5C.7 8.5 3 4.8 6.5 4.8c1.9 0 3.2 1 4 2.2.8-1.2 2.1-2.2 4-2.2 3.5 0 5.8 3.7 4 7.7C19 16.65 12 21 12 21z"/>',
  'Training Payments': '<rect x="2.5" y="5" width="19" height="14" rx="2"/><line x1="2.5" y1="10" x2="21.5" y2="10"/>',
  'Gear Ordering': '<path d="M6 8l1-4h10l1 4"/><rect x="4" y="8" width="16" height="13" rx="2"/><path d="M9 12a3 3 0 0 0 6 0"/>',
  'Photo Sharing': '<rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/>',
  'Sign-Ups': '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3h6v3H9z"/><path d="M8 13l2.5 2.5L16 10"/>',
  'Race Stats': '<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>',
  'Files': '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  'Admin': '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
};
const iconSvg = label => `<svg viewBox="0 0 24 24">${ICONS[label] || ICONS['Files']}</svg>`;

/* ============ nav ============ */
function go(screen, push = true) {
  if (push && S.screen !== screen) S.history.push(S.screen);
  S.screen = screen;
  render();
}
function goBack() {
  const prev = S.history.pop() || 'home';
  S.screen = prev;
  render();
}

/* ============ boot ============ */
async function boot() {
  try {
    const res = await fetch('/api/asana?action=bootstrap');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    S.tiles = data.tiles || [];
    S.config = data.config || {};
  } catch (e) {
    document.getElementById('view').innerHTML =
      `<div class="msg err">Couldn't reach the server.<br><small>${esc(e.message)}</small></div>`;
    return;
  }

  const saved = JSON.parse(localStorage.getItem('nlbmx_hub') || 'null');
  if (saved?.gid && saved?.session) {
    try {
      S.session = saved.session;
      S.user = { gid: saved.gid };
      const me = await api('me');
      S.user = me.user; S.fields = me.fields; S.isAdmin = me.user.isAdmin;
      S.screen = 'home';
    } catch {
      clearSave(); S.user = null; S.session = null; S.screen = 'auth';
    }
  } else {
    S.screen = 'auth';
  }
  render();
}

/* ============ render ============ */
function render() {
  const v = document.getElementById('view');
  document.getElementById('backBtn').disabled =
    ['auth', 'home', 'loading'].includes(S.screen);
  document.getElementById('menuBtn').disabled =
    ['auth', 'loading'].includes(S.screen);
  v.innerHTML = (SCREENS[S.screen] || SCREENS.home)();
  window.scrollTo(0, 0);
}

const SCREENS = {
  loading: () => '<div class="spinner"></div>',

  /* ---------- auth ---------- */
  auth: () => {
    const m = window.__authMode || 'login';
    if (m === 'login') return `
      <h2>Welcome back</h2>
      <p class="sub">Sign in with your email and PIN.</p>
      <label>Email</label>
      <input id="li_email" type="email" autocomplete="email" placeholder="you@email.com">
      <label>PIN</label>
      <input id="li_pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
      <button class="btn" onclick="doLogin()">Sign In</button>
      <button class="linkbtn" onclick="window.__authMode='signup';render()">New to the team? Create an account</button>
      <div id="authMsg"></div>`;
    return `
      <h2>Join the team</h2>
      <p class="sub">Create your account to get started.</p>
      <label>Full Name</label>
      <input id="su_name" placeholder="First and last name">
      <label>Email</label>
      <input id="su_email" type="email" autocomplete="email" placeholder="you@email.com">
      <label>Phone</label>
      <input id="su_phone" type="tel" autocomplete="tel" placeholder="(239) 555-0123">
      <label>Are you a…?</label>
      <div class="radio-row">
        <button onclick="setRole('RIDER')" id="r_RIDER">Rider</button>
        <button onclick="setRole('PARENT')" id="r_PARENT">Parent/Guardian</button>
        <button onclick="setRole('BOTH')" id="r_BOTH">Both</button>
      </div>
      <div id="roleExtra"></div>
      <label>Choose a PIN (4+ digits)</label>
      <input id="su_pin" type="password" inputmode="numeric" placeholder="••••">
      <button class="btn" onclick="doSignup()">Create Account</button>
      <button class="linkbtn" onclick="window.__authMode='login';render()">Already have an account? Sign in</button>
      <div id="authMsg"></div>`;
  },

  /* ---------- home ---------- */
  home: () => {
    const showForms = S.user &&
      (S.user.role === 'PARENT' || S.user.role === 'BOTH' ||
       (S.user.role === 'RIDER' && !isMinor(S.fields.DOB)));
    const done = S.fields.FORM_STATUS === 'Complete';

    let html = `<p class="sub" style="margin-bottom:14px">Welcome back, <b style="color:var(--text)">${esc((S.user?.name || '').split(' ')[0])}</b></p>`;

    if (showForms && !done) {
      html += `<button class="banner" onclick="go('forms')">
        <div class="bicon"><svg viewBox="0 0 24 24">${ICONS['Team Forms']}</svg></div>
        <div><div class="t1">Team Forms</div>
        <div class="t2">Complete your ${esc(S.config.season || '2026-2027')} agreement — start here</div></div>
      </button>`;
    }

    const tiles = S.tiles.filter(t => {
      if (t.label === 'Team Forms') return false;
      if (t.visibility === 'admin' && !S.isAdmin) return false;
      return true;
    });

    html += '<div class="grid">';
    for (const t of tiles) {
      const inner = t.icon
        ? `<img src="${esc(t.icon)}" alt="">`
        : iconSvg(t.label);
      html += `<button class="tile" onclick="tapTile('${t.gid}')">
        <div class="ticon">${inner}</div>
        <span>${esc(t.label.toUpperCase())}</span>
      </button>`;
    }
    if (S.isAdmin) {
      html += `<button class="tile" onclick="go('admin')">
        <div class="ticon">${iconSvg('Admin')}</div><span>ADMIN</span></button>`;
    }
    html += '</div>';
    return html;
  },

  /* ---------- gear submenu ---------- */
  gear: () => {
    const t = S.tiles.find(x => x.label === 'Gear Ordering') || { sub: {} };
    const opt = (label, url, note) => url
      ? `<div class="card" onclick="window.open('${esc(url)}','_blank')">
           <div class="cname">${label}</div><div class="cmeta">Opens the vendor's order page</div></div>`
      : `<div class="card" style="opacity:.55;cursor:default">
           <div class="cname">${label}</div><div class="cmeta">${note}</div></div>`;
    return `<h2>Gear Ordering</h2>
      <p class="sub">Order directly from our vendors.</p>
      ${opt('Gear', t.sub.gear, 'Coming soon')}
      ${opt('Jerseys &amp; Apparel', t.sub.jerseys, 'Coming soon')}
      ${opt('Number Plates', t.sub.plates, 'Coming soon')}`;
  },

  /* ---------- roster ---------- */
  roster: () => {
    if (!S.riders.length) return '<div class="spinner"></div>';
    let html = `<h2>Team Roster</h2><p class="sub">${S.riders.length} rider${S.riders.length === 1 ? '' : 's'}</p>`;
    for (const r of S.riders) {
      const a = age(r.dob);
      const bits = [r.raceNumber && `#${r.raceNumber}`, r.proficiency, a !== '' && `${a}y`]
        .filter(Boolean).join(' · ');
      const pill = S.isAdmin
        ? (r.formStatus === 'Complete'
            ? '<span class="pill ok">FORM ✓</span>'
            : '<span class="pill wait">FORM PENDING</span>')
        : '';
      html += `<div class="card" onclick="viewRider('${r.gid}')">
        <div class="cname">${esc(r.name)}${pill}</div>
        <div class="cmeta">${esc(bits || 'No details yet')}</div>
      </div>`;
    }
    return html;
  },

  riderProfile: () => {
    const r = S.viewRider;
    if (!r) return '<div class="empty">Rider not found.</div>';
    const row = (k, v) => v ? `<div class="kv"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>` : '';
    let html = `<h2>${esc(r.name)}</h2><p class="sub">${esc(r.nickname || 'Rider profile')}</p>`;
    html += row('Birthday', r.dob);
    html += row('Age', age(r.dob));
    html += row('Race Number', r.raceNumber);
    html += row('Proficiency', r.proficiency);
    html += row('Email', r.email);
    html += row('Phone', r.phone);
    if (S.isAdmin) {
      html += `<p class="sub" style="margin:22px 0 0;font-weight:700;color:var(--orange)">COACHES ONLY</p>`;
      html += row('USA BMX #', r.usabmx);
      html += row('Emergency Contact', r.emergencyContact);
      html += row('Emergency Phone', r.emergencyPhone);
      html += row('Form Status', r.formStatus);
      if (r.pendingMatch) html += row('⚠ Pending Match', r.pendingMatch);
    }
    if (!r.email && !r.phone && !S.isAdmin) {
      html += `<p class="sub" style="margin-top:18px">This rider's contact info is private.</p>`;
    }
    return html;
  },

  /* ---------- profile ---------- */
  profile: () => {
    const f = S.fields;
    const sw = (id, on) => `<button class="switch ${on ? 'on' : ''}" id="${id}" onclick="this.classList.toggle('on')"></button>`;
    return `<h2>My Profile</h2>
      <p class="sub">${esc(S.user?.email || '')}</p>
      <label>Phone</label><input id="p_phone" value="${esc(f.PHONE || '')}" type="tel">
      <label>Nickname</label><input id="p_nick" value="${esc(f.NICKNAME || '')}">
      ${(S.user?.role === 'RIDER' || S.user?.role === 'BOTH') ? `
        <label>Race Number</label><input id="p_race" value="${esc(f.RACE_NUMBER || '')}">
        <label>Proficiency</label><input id="p_prof" value="${esc(f.PROFICIENCY || '')}">
      ` : ''}
      <p class="sub" style="margin:24px 0 0;font-weight:700;color:var(--text)">Privacy</p>
      <div class="toggle-row">
        <div><div class="tl">Share my phone</div><div class="tn">Visible to the whole team</div></div>
        ${sw('p_phonePub', (f.PHONE_PUBLIC || '') === 'true')}
      </div>
      <div class="toggle-row">
        <div><div class="tl">Share my email</div><div class="tn">Visible to the whole team</div></div>
        ${sw('p_emailPub', (f.EMAIL_PUBLIC || '') === 'true')}
      </div>
      <button class="btn" onclick="saveProfile()">Save Changes</button>
      <button class="linkbtn" onclick="logout()">Sign out</button>
      <div id="profMsg"></div>`;
  },

  /* ---------- team forms ---------- */
  forms: () => {
    const step = window.__formStep || 1;
    const isParent = S.user?.role === 'PARENT' || S.user?.role === 'BOTH';

    if (step === 1) return `
      <div class="steps">STEP 1 OF 4</div>
      <h2>Welcome to Next Level BMX!</h2>
      <p class="sub">We're excited to have you as part of our BMX family.</p>
      <p style="font-size:13.5px;line-height:1.6">At Next Level, we're all about riding hard, great sportsmanship, and representing our team's values both on and off the track. But most importantly — we want you to have fun and enjoy the sport of BMX!</p>
      <p style="font-size:13.5px;line-height:1.6"><b>${esc(S.config.season || '2026-2027')} Rider &amp; Parent Agreement</b><br>
      <span style="color:var(--muted)">${esc(S.config.seasonDates || 'October 1, 2026 – May 30, 2027')}</span></p>
      <button class="btn" onclick="formStep(2)">Get Started</button>`;

    if (step === 2) return `
      <div class="steps">STEP 2 OF 4 — RIDER INFO</div>
      <h2>Rider Details</h2>
      <p class="sub">${isParent ? "Enter your rider's information." : 'Enter your information.'}</p>
      <label>Rider Name</label><input id="f_name" value="${esc(isParent ? '' : S.user?.name || '')}">
      <label>Nickname</label><input id="f_nick" value="${esc(S.fields.NICKNAME || '')}">
      <label>Birthdate</label><input id="f_dob" type="date" value="${esc(S.fields.DOB || '')}">
      <label>USA BMX Member #</label><input id="f_usabmx" value="${esc(S.fields.USABMX || '')}">
      <label>Current Proficiency</label>
      <select id="f_prof">
        <option value="">Select…</option>
        ${['Novice','Intermediate','Expert','Girl Novice','Girl Intermediate','Girl Ex','Cruiser','Open']
          .map(p => `<option ${S.fields.PROFICIENCY === p ? 'selected' : ''}>${p}</option>`).join('')}
      </select>
      <label>Race Number <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <input id="f_race" value="${esc(S.fields.RACE_NUMBER || '')}">
      <button class="btn" onclick="formStep(3)">Continue</button>`;

    if (step === 3) return `
      <div class="steps">STEP 3 OF 4 — CONTACT &amp; EMERGENCY</div>
      <h2>Contact Info</h2>
      <p class="sub">Emergency contact is always kept private to coaches.</p>
      <label>Emergency Contact Name</label>
      <input id="f_emName" value="${esc(S.fields.EMERGENCY_NAME || '')}">
      <label>Emergency Contact Phone</label>
      <input id="f_emPhone" type="tel" value="${esc(S.fields.EMERGENCY_PHONE || '')}">
      <p class="sub" style="margin:24px 0 0;font-weight:700;color:var(--text)">Privacy Choices</p>
      <div class="toggle-row">
        <div><div class="tl">Share phone with team</div><div class="tn">Otherwise coaches only</div></div>
        <button class="switch ${(S.fields.PHONE_PUBLIC || '') === 'true' ? 'on' : ''}" id="f_phonePub" onclick="this.classList.toggle('on')"></button>
      </div>
      <div class="toggle-row">
        <div><div class="tl">Share email with team</div><div class="tn">Otherwise coaches only</div></div>
        <button class="switch ${(S.fields.EMAIL_PUBLIC || '') === 'true' ? 'on' : ''}" id="f_emailPub" onclick="this.classList.toggle('on')"></button>
      </div>
      <button class="btn" onclick="formStep(4)">Continue</button>`;

    return `
      <div class="steps">STEP 4 OF 4 — AGREEMENT</div>
      <h2>Rider &amp; Parent Agreement</h2>
      <p class="sub">Please read, then sign below.</p>
      <div class="agreement">${AGREEMENT}</div>
      <label>Type your full name to sign</label>
      <input id="f_sig" placeholder="${esc(S.user?.name || 'Your full name')}">
      <p class="sub" style="margin-top:8px;font-size:11.5px">
        Signing as <b>${isParent ? 'Parent / Guardian' : 'Rider (18+)'}</b> on ${new Date().toLocaleDateString()}.
      </p>
      <button class="btn" onclick="submitForm()">Sign &amp; Submit</button>
      <div id="formMsg"></div>`;
  },

  /* ---------- sign-ups ---------- */
  signups: () => {
    if (!S.events) return '<div class="spinner"></div>';
    if (!S.events.length) return `<h2>Race Sign-Ups</h2>
      <div class="empty">No sign-up boards posted yet.<br>Check back before the next race.</div>`;
    let html = `<h2>Race Sign-Ups</h2><p class="sub">Claim what you can bring.</p>`;
    for (const e of S.events) {
      html += `<div style="margin-bottom:26px">
        <div style="font-size:15px;font-weight:800">${esc(e.name)}</div>
        <div class="cmeta" style="margin-bottom:10px">${esc(e.date || '')}</div>`;
      for (const s of e.slots) {
        const mine = s.claimedGid === S.user?.gid;
        const open = !s.claimedBy;
        html += `<div class="card" style="cursor:default;display:flex;justify-content:space-between;align-items:center;gap:10px">
          <div style="flex:1">
            <div class="cname" style="font-size:13.5px">${esc(s.item)}</div>
            <div class="cmeta">${open ? 'Open' : (mine ? 'You claimed this' : esc(s.claimedBy))}</div>
          </div>
          ${open
            ? `<button class="btn slim" style="width:auto;padding:9px 14px;margin:0" onclick="claim('${s.gid}',false)">Claim</button>`
            : mine
              ? `<button class="btn slim alt" style="width:auto;padding:9px 14px;margin:0" onclick="claim('${s.gid}',true)">Release</button>`
              : `<span class="pill ok">TAKEN</span>`}
        </div>`;
      }
      html += '</div>';
    }
    return html;
  },

  /* ---------- admin ---------- */
  admin: () => {
    let html = `<h2>Admin</h2><p class="sub">Manage tiles and sign-up boards.</p>`;
    html += `<p class="sub" style="font-weight:700;color:var(--text);margin-bottom:8px">Tiles</p>`;
    for (const t of S.tiles) {
      html += `<div class="card" onclick="editTile('${t.gid}')">
        <div class="cname">${esc(t.label)}</div>
        <div class="cmeta">${esc(t.link || 'No link')} · ${esc(t.visibility)}</div>
      </div>`;
    }
    html += `<button class="btn alt slim" onclick="go('newEvent')">+ New Sign-Up Board</button>`;
    const pend = S.riders.filter(r => r.pendingMatch);
    if (pend.length) {
      html += `<p class="sub" style="font-weight:700;color:var(--orange);margin:26px 0 8px">Pending Name Matches</p>`;
      for (const r of pend) {
        html += `<div class="card" style="cursor:default">
          <div class="cname">${esc(r.name)}</div>
          <div class="cmeta">${esc(r.pendingMatch)}</div>
          <div class="cmeta" style="margin-top:6px">Resolve in Asana.</div>
        </div>`;
      }
    }
    return html;
  },

  editTile: () => {
    const t = S.editing;
    if (!t) return '<div class="empty">Tile not found.</div>';
    return `<h2>${esc(t.label)}</h2><p class="sub">Changes save to Asana instantly — no redeploy.</p>
      <label>Link URL</label><input id="e_link" value="${esc(t.link || '')}">
      <label>Icon Image URL</label><input id="e_icon" value="${esc(t.icon || '')}" placeholder="Public image link">
      <label>Order</label><input id="e_order" type="number" value="${t.order}">
      <label>Visibility</label>
      <div class="radio-row">
        <button id="v_public" class="${t.visibility === 'public' ? 'on' : ''}" onclick="setVis('public')">Everyone</button>
        <button id="v_admin" class="${t.visibility === 'admin' ? 'on' : ''}" onclick="setVis('admin')">Admin only</button>
      </div>
      ${t.label === 'Gear Ordering' ? `
        <label>Gear link</label><input id="e_gear" value="${esc(t.sub.gear || '')}">
        <label>Jerseys / Apparel link</label><input id="e_jers" value="${esc(t.sub.jerseys || '')}">
        <label>Number Plates link</label><input id="e_plat" value="${esc(t.sub.plates || '')}">` : ''}
      <button class="btn" onclick="saveTile()">Save Tile</button>
      <div id="tileMsg"></div>`;
  },

  newEvent: () => `
    <h2>New Sign-Up Board</h2>
    <p class="sub">Default race items are pre-filled. Edit freely.</p>
    <label>Event Name</label><input id="ev_name" placeholder="e.g. Oldsmar State Race">
    <label>Date</label><input id="ev_date" type="date">
    <label>Items needed (one per line)</label>
    <textarea id="ev_items" rows="9">${DEFAULT_ITEMS}</textarea>
    <button class="btn" onclick="createEvent()">Create Board</button>
    <div id="evMsg"></div>`,
};

/* ============ content ============ */
const DEFAULT_ITEMS = `Ice — 3 bags (Saturday)
Ice — 2 bags (Sunday)
Water — 2 gallons (Friday)
Water — 2 gallons (Saturday)
Water — 2 gallons (Sunday)
Assorted Chips/Snacks — variety, 18-24 count
Bars — variety, 18-24 count
Trail Mix — variety, 18-24 count
Fruit — watermelon, mandarins, grapes, apples, bananas`;

const AGREEMENT = `
<h4>Participation Requirements</h4>
<ul>
<li>Riders are expected to actively participate in BMX events, races, clinics, and training throughout the season.</li>
<li>Each rider must compete in 8 local races, 3 State races, and the State Championship race.</li>
<li>All riders must maintain an active USABMX membership.</li>
<li>Riders and families are required to volunteer with organizing, setup, and breakdown of the team area at State races.</li>
<li>Riders are encouraged to seek sponsorship from friends, family, and organizations to help take the team to the NEXT LEVEL!</li>
</ul>
<h4>Team Fees</h4>
<ul>
<li>A team operations fee of $100.00 is collected per rider. This covers team operations and the annual charter fee.</li>
<li>Jerseys, shirts, and race plates are ordered separately through our vendors and are not included in this fee.</li>
<li>Team trainings and skill clinics are held throughout the season at additional cost, dependent upon sponsorships.</li>
</ul>
<h4>Uniform &amp; Appearance</h4>
<ul>
<li>Team jersey and black pants (any brand) must be worn at all Florida State Series BMX races.</li>
<li>The team jersey may not be worn during any event or activity that could create negative publicity for the team or its sponsors.</li>
</ul>
<h4>Training &amp; Safety</h4>
<ul>
<li>Riders must attend team practices, training events, races, and meetings as scheduled.</li>
<li>Helmets are required anytime a rider is on a bike, whether during a team activity or riding independently.</li>
<li>Riders must always ride in a safe and courteous manner.</li>
</ul>
<h4>Code of Conduct</h4>
<ul>
<li>Riders and parents/guardians are expected to demonstrate good conduct and sportsmanship at all times.</li>
<li>Parents or guardians transporting riders who are not their own are fully responsible for those riders during the event weekend.</li>
</ul>
<h4>Membership Changes</h4>
<ul>
<li>Riders may petition the Team Manager in writing to be released from the team. Requests are reviewed with a decision within 72 hours.</li>
<li>Riders may be removed at the discretion of the Team Manager/Coaches if they pose a health or safety risk, or engage in conduct inconsistent with team values.</li>
</ul>
<h4>Disciplinary Actions</h4>
<ul>
<li>Any violation of this agreement may result in suspension or removal from the team without prior warning.</li>
<li>Suspended or removed riders forfeit all team benefits, earned or unearned.</li>
<li>All decisions regarding suspension or removal are made by the team committee.</li>
</ul>
<h4>Acknowledgment of Risk</h4>
<p>By signing below, you acknowledge that you have read and agree to the terms outlined in this agreement; that BMX training and racing are inherently dangerous activities that may result in serious injury or death; and that you agree to hold Next Level BMX, its members, coaches, volunteers, and affiliated organizations harmless for any injuries sustained during participation.</p>
`;

/* ============ actions ============ */
let ROLE = '';
function setRole(r) {
  ROLE = r;
  for (const x of ['RIDER', 'PARENT', 'BOTH']) {
    document.getElementById('r_' + x)?.classList.toggle('on', x === r);
  }
  const extra = document.getElementById('roleExtra');
  let html = '';
  if (r === 'RIDER') {
    html = `<label>Your Birthdate</label><input id="su_dob" type="date">`;
  }
  if (r === 'PARENT' || r === 'BOTH') {
    html += `<label>Your Rider's Name(s)</label>
      <input id="su_r1" placeholder="Rider 1 full name">
      <input id="su_r2" placeholder="Rider 2 (optional)" style="margin-top:8px">`;
  }
  extra.innerHTML = html;
}

function setVis(v) {
  document.getElementById('v_public').classList.toggle('on', v === 'public');
  document.getElementById('v_admin').classList.toggle('on', v === 'admin');
}

const msg = (id, text, kind = 'err') => {
  const el = document.getElementById(id);
  if (el) el.innerHTML = `<div class="msg ${kind}">${esc(text)}</div>`;
};

async function doSignup() {
  const name = document.getElementById('su_name').value.trim();
  const email = document.getElementById('su_email').value.trim();
  const phone = document.getElementById('su_phone').value.trim();
  const pin = document.getElementById('su_pin').value.trim();
  const dob = document.getElementById('su_dob')?.value || '';
  const riderNames = [
    document.getElementById('su_r1')?.value.trim(),
    document.getElementById('su_r2')?.value.trim(),
  ].filter(Boolean);

  if (!name || !email || !pin || !ROLE) return msg('authMsg', 'Please fill in every field.');
  if (pin.length < 4) return msg('authMsg', 'PIN must be at least 4 digits.');
  if (ROLE === 'RIDER' && !dob) return msg('authMsg', 'Please enter your birthdate.');
  if ((ROLE === 'PARENT' || ROLE === 'BOTH') && !riderNames.length)
    return msg('authMsg', "Please enter your rider's name.");

  try {
    msg('authMsg', 'Creating your account…', 'ok');
    const r = await api('signup', { name, email, phone, role: ROLE, dob, pin, riderNames });
    S.user = r.user; S.session = r.session;
    const me = await api('me');
    S.fields = me.fields; S.isAdmin = me.user.isAdmin;
    save();
    go('home', false);
  } catch (e) { msg('authMsg', e.message); }
}

async function doLogin() {
  const email = document.getElementById('li_email').value.trim();
  const pin = document.getElementById('li_pin').value.trim();
  if (!email || !pin) return msg('authMsg', 'Enter your email and PIN.');
  try {
    msg('authMsg', 'Signing in…', 'ok');
    const r = await api('login', { email, pin });
    S.user = r.user; S.session = r.session;
    const me = await api('me');
    S.fields = me.fields; S.isAdmin = me.user.isAdmin;
    save();
    S.history = [];
    go('home', false);
  } catch (e) { msg('authMsg', e.message); }
}

function logout() {
  clearSave();
  S.user = null; S.session = null; S.fields = {}; S.history = [];
  window.__authMode = 'login';
  go('auth', false);
}

async function tapTile(gid) {
  const t = S.tiles.find(x => x.gid === gid);
  if (!t) return;
  if (t.label === 'Roster') {
    go('roster');
    const r = await api('roster');
    S.riders = r.riders; S.isAdmin = r.isAdmin;
    render();
    return;
  }
  if (t.label === 'Sign-Ups') {
    S.events = null; go('signups');
    const r = await api('signups');
    S.events = r.events; render();
    return;
  }
  if (t.label === 'Gear Ordering') return go('gear');
  if (t.label === 'Team Forms') return go('forms');
  if (t.link && t.link.startsWith('http')) return window.open(t.link, '_blank');
  alert('This link hasn\'t been added yet.');
}

function viewRider(gid) {
  S.viewRider = S.riders.find(r => r.gid === gid);
  go('riderProfile');
}

async function saveProfile() {
  const u = {
    PHONE: document.getElementById('p_phone').value.trim(),
    NICKNAME: document.getElementById('p_nick').value.trim(),
    PHONE_PUBLIC: document.getElementById('p_phonePub').classList.contains('on') ? 'true' : 'false',
    EMAIL_PUBLIC: document.getElementById('p_emailPub').classList.contains('on') ? 'true' : 'false',
  };
  const race = document.getElementById('p_race');
  if (race) { u.RACE_NUMBER = race.value.trim(); u.PROFICIENCY = document.getElementById('p_prof').value.trim(); }
  try {
    const r = await api('updateProfile', { updates: u });
    S.fields = r.fields;
    msg('profMsg', 'Saved.', 'ok');
  } catch (e) { msg('profMsg', e.message); }
}

let FORM = {};
function formStep(n) {
  if (n === 3) {
    FORM.name = document.getElementById('f_name').value.trim();
    FORM.nickname = document.getElementById('f_nick').value.trim();
    FORM.dob = document.getElementById('f_dob').value;
    FORM.usabmx = document.getElementById('f_usabmx').value.trim();
    FORM.proficiency = document.getElementById('f_prof').value;
    FORM.raceNumber = document.getElementById('f_race').value.trim();
    if (!FORM.name || !FORM.dob) return alert('Rider name and birthdate are required.');
  }
  if (n === 4) {
    FORM.emergencyName = document.getElementById('f_emName').value.trim();
    FORM.emergencyPhone = document.getElementById('f_emPhone').value.trim();
    FORM.phonePublic = document.getElementById('f_phonePub').classList.contains('on');
    FORM.emailPublic = document.getElementById('f_emailPub').classList.contains('on');
    if (!FORM.emergencyName || !FORM.emergencyPhone)
      return alert('Emergency contact name and phone are required.');
  }
  window.__formStep = n;
  render();
}

async function submitForm() {
  const sig = document.getElementById('f_sig').value.trim();
  if (sig.length < 3) return msg('formMsg', 'Please type your full name to sign.');
  FORM.signature = sig;
  FORM.signerRole = (S.user.role === 'PARENT' || S.user.role === 'BOTH') ? 'Parent/Guardian' : 'Rider 18+';
  try {
    msg('formMsg', 'Submitting…', 'ok');
    const r = await api('submitForm', { form: FORM });
    S.fields = r.fields;
    window.__formStep = 1; FORM = {};
    msg('formMsg', 'Agreement signed. Thank you!', 'ok');
    setTimeout(() => go('home', false), 1200);
  } catch (e) { msg('formMsg', e.message); }
}

async function claim(slotGid, release) {
  try {
    await api('claimSlot', { slotGid, userName: S.user.name, release });
    const r = await api('signups');
    S.events = r.events; render();
  } catch (e) { alert(e.message); }
}

function editTile(gid) {
  S.editing = S.tiles.find(t => t.gid === gid);
  go('editTile');
}

async function saveTile() {
  const t = S.editing;
  const u = {
    LINK: document.getElementById('e_link').value.trim(),
    ICON_URL: document.getElementById('e_icon').value.trim(),
    ORDER: document.getElementById('e_order').value,
    VISIBILITY: document.getElementById('v_admin').classList.contains('on') ? 'admin' : 'public',
  };
  if (document.getElementById('e_gear')) {
    u.SUBLINK_GEAR = document.getElementById('e_gear').value.trim();
    u.SUBLINK_JERSEYS = document.getElementById('e_jers').value.trim();
    u.SUBLINK_PLATES = document.getElementById('e_plat').value.trim();
  }
  try {
    await api('adminSaveTile', { tileGid: t.gid, updates: u });
    const res = await fetch('/api/asana?action=bootstrap');
    const data = await res.json();
    S.tiles = data.tiles;
    msg('tileMsg', 'Saved.', 'ok');
  } catch (e) { msg('tileMsg', e.message); }
}

async function createEvent() {
  const eventName = document.getElementById('ev_name').value.trim();
  const date = document.getElementById('ev_date').value;
  const items = document.getElementById('ev_items').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!eventName) return msg('evMsg', 'Give the event a name.');
  try {
    msg('evMsg', 'Creating…', 'ok');
    await api('adminCreateEvent', { eventName, date, items });
    msg('evMsg', 'Board created.', 'ok');
    setTimeout(() => go('admin', false), 900);
  } catch (e) { msg('evMsg', e.message); }
}

boot();
</script>
</body>
</html>
